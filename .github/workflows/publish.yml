name: Publish

# Publishes to npm when a GitHub release is published (tag `v<version>`).
# Needs the NPM_TOKEN secret, or npm trusted publishing for this workflow.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to approve each release.
    environment: npm
    env:
      MOLLIE_TEST_API_KEY: ${{ secrets.MOLLIE_TEST_API_KEY }}
      MOLLIE_TEST_METHOD: ${{ vars.MOLLIE_TEST_METHOD }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The release tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$TAG" ]; then
            echo "Release tag $TAG does not match package.json ($version)"
            exit 1
          fi
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:memory
      - name: Install Chromium
        if: env.MOLLIE_TEST_API_KEY != ''
        run: pnpm exec playwright install --with-deps chromium
      - name: Run against Mollie test mode
        if: env.MOLLIE_TEST_API_KEY != ''
        run: pnpm test:integration
      - run: pnpm build
      - run: pnpm lint:package
      # A prerelease (1.0.0-alpha.0) goes out under its own dist-tag (alpha),
      # so `latest` keeps pointing at the last stable version. (npm sets
      # `latest` too on a package's very first publish, so until 1.0 it is
      # an alpha; the README tells to install `@alpha` and pin it.)
      - name: Publish
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag=latest
          case "$version" in *-*) pre="${version#*-}"; tag="${pre%%.*}" ;; esac
          pnpm publish --provenance --access public --no-git-checks --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
